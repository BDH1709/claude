# nginx-configuratie voor de statische vacaturetool van Bas.
# Kopieer dit bestand naar /etc/nginx/sites-available/bas-vacaturetool
# en plaats een symlink in /etc/nginx/sites-enabled/ (zie README.md).

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/bas-vacaturetool;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON-data en assets mogen kort gecachet worden; tijdens ontwikkeling
    # kun je deze regel weglaten om altijd de nieuwste data te zien.
    location /data/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
}
